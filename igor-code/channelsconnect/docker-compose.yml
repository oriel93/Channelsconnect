version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: channelsconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: channelsconnect
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - channelsconnect

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: channelsconnect-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/channelsconnect
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PORT: 3001
      FRONTEND_URL: http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - channelsconnect
    command: sh -c "npx prisma migrate deploy && npm run start:prod"

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: channelsconnect-app
    restart: unless-stopped
    ports:
      - '80:80'
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_SUPABASE_URL: ${SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    depends_on:
      - api
    networks:
      - channelsconnect

volumes:
  postgres_data:

networks:
  channelsconnect:
    driver: bridge

